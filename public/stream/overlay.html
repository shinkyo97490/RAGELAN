<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay RAGE LAN 2026</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Source navigateur OBS : 1920 × 1080, fond transparent */
  :root { --fire: linear-gradient(180deg, #ffd23f 0%, #ff8a1f 45%, #f2361f 100%); --fire-h: linear-gradient(90deg, #ffd23f, #ff8a1f 50%, #f2361f); --c: #ff8a1f; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Inter', sans-serif; color: #fff; }
  .anton { font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; }
  .fire { background: var(--fire); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hide { display: none !important; }

  /* ---------- Scène MATCH ---------- */
  #match { position: absolute; inset: 0; }
  .bug { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; height: 84px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
  .team { width: 470px; background: rgba(8,8,12,.92); display: flex; align-items: center; padding: 0 28px; font-size: 40px; white-space: nowrap; overflow: hidden; }
  .team.a { justify-content: flex-end; border-left: 8px solid var(--c); clip-path: polygon(24px 0, 100% 0, 100% 100%, 0 100%); }
  .team.b { justify-content: flex-start; border-right: 8px solid var(--c); clip-path: polygon(0 0, 100% 0, calc(100% - 24px) 100%, 0 100%); }
  .score { width: 92px; display: flex; align-items: center; justify-content: center; font-size: 60px; background: var(--fire-h); color: #000; }
  .mid { width: 210px; background: #0b0b10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-left: 2px solid #222; border-right: 2px solid #222; }
  .mid img { max-height: 40px; max-width: 170px; }
  .mid .bo { font-size: 18px; color: #ffb24d; letter-spacing: .12em; }
  .bugwrap.bottom .bug { top: auto; bottom: 112px; }
  .bugwrap.bottom .phase { top: auto; bottom: 80px; }
  .phase { position: absolute; top: 106px; left: 50%; transform: translateX(-50%); background: var(--c); color: #000; font-size: 22px; padding: 3px 18px; letter-spacing: .12em; white-space: nowrap; }

  .lower { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; background: rgba(8,8,12,.92); border-top: 4px solid; border-image: var(--fire-h) 1; }
  .lower .logo { height: 64px; padding: 0 22px; display: flex; align-items: center; background: #000; }
  .lower .logo img { height: 46px; }
  .ticker { flex: 1; overflow: hidden; white-space: nowrap; font-size: 26px; font-weight: 700; }
  .ticker span { display: inline-block; padding-left: 100%; animation: scroll 26s linear infinite; }
  .ticker.static span { padding-left: 28px; animation: none; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  .partners { display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 100%; background: #000; }
  .partners span { font-size: 14px; letter-spacing: .2em; color: #aaa; }
  .partners img { height: 44px; }
  .handle { padding: 0 22px; font-size: 22px; color: #c9a8ff; white-space: nowrap; }

  /* ---------- Scènes plein écran ---------- */
  #full { position: absolute; inset: 0; background: #000 url('../assets/img/hero.jpg') center/cover; }
  #full::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(40,12,2,.55), rgba(0,0,0,.92) 70%); }
  #full .glow { position: absolute; left: -10%; right: -10%; bottom: -200px; height: 420px; background: radial-gradient(ellipse at center, rgba(255,110,20,.45), transparent 65%); animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; transform: scale(1.05); } }
  #full .inner { position: absolute; inset: 0 0 150px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #full .rl { width: 600px; filter: drop-shadow(0 12px 40px rgba(0,0,0,.8)); }
  #full .title { font-size: 104px; margin-top: 6px; line-height: 1; }
  #full .sub { font-size: 34px; color: #ddd; margin-top: 10px; letter-spacing: .06em; }
  #full .count { font-size: 92px; margin-top: 4px; }
  #full .next { margin-top: 18px; background: rgba(0,0,0,.6); border: 2px solid #ff8a1f; border-radius: 14px; padding: 16px 34px; min-width: 760px; }
  #full .next h3 { margin: 0 0 8px; font-size: 30px; color: #ff8a1f; letter-spacing: .15em; }
  #full .next div { font-size: 30px; font-weight: 700; padding: 4px 0; }
  #full .foot { position: absolute; bottom: 36px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 30px; }
  #full .foot img { height: 70px; }
  #full .foot .h { font-size: 28px; color: #c9a8ff; }
</style>
</head>
<body>

<div id="match">
  <div class="bugwrap" id="bugwrap">
  <div class="bug">
    <div class="team a anton" id="teamA">Équipe A</div>
    <div class="score anton" id="scoreA">0</div>
    <div class="mid"><img id="gameLogo" src="" alt=""><div class="bo anton" id="bo">BO3</div></div>
    <div class="score anton" id="scoreB">0</div>
    <div class="team b anton" id="teamB">Équipe B</div>
  </div>
  <div class="phase anton" id="phase">Phase de groupes</div>
  </div>
  <div class="lower">
    <div class="logo"><img src="../assets/logos/ragelan.png" alt=""></div>
    <div class="ticker" id="ticker"><span id="msg"></span></div>
    <div class="handle">twitch.tv/rushxptv</div>
    <div class="partners"><span>PARTENAIRES</span><img src="../assets/logos/orange.png" alt=""><img src="../assets/logos/mcdo.png" alt=""><img src="../assets/logos/saintpaul.png" alt=""></div>
  </div>
</div>

<div id="full" class="hide">
  <div class="glow"></div>
  <div class="inner">
    <img class="rl" src="../assets/logos/ragelan.png" alt="">
    <div class="title anton fire" id="fTitle"></div>
    <div class="sub" id="fSub"></div>
    <div class="count anton" id="fCount"></div>
    <div class="next" id="fNext"><h3 class="anton">À SUIVRE</h3><div id="fNextList"></div></div>
  </div>
  <div class="foot">
    <img src="../assets/logos/orange.png" alt=""><img src="../assets/logos/mcdo.png" alt=""><img src="../assets/logos/saintpaul.png" alt="">
    <span class="h">twitch.tv/rushxptv · discord.gg/VMUXA2z5Y9</span>
  </div>
</div>

<script>
  const GAMES = {
    valorant: {logo: '../assets/logos/valorant.png', color: '#FF4655'},
    rocketleague: {logo: '../assets/logos/rl.png', color: '#1E8BFF'},
    fc27: {logo: '../assets/logos/fc27.png', color: '#00FF6A'},
    libres: {logo: '../assets/logos/rushxp.png', color: '#FF8A1F'},
  };
  const SCENES = {
    starting: {title: 'Le live commence bientôt', sub: '21 & 22 novembre 2026 · Complexe Sportif de Saint-Paul'},
    pause: {title: 'Pause', sub: 'On revient très vite !'},
    end: {title: 'Merci d\'avoir suivi la RAGE LAN', sub: 'Rendez-vous sur le Discord RushXP pour les résultats'},
  };
  // ?scene=starting|pause|end|match force une scène (une source OBS par scène)
  const forced = new URLSearchParams(location.search).get('scene');
  const $ = (id) => document.getElementById(id);
  let st = null;

  function apply() {
    if (!st) return;
    const scene = forced || st.scene;
    $('match').classList.toggle('hide', scene !== 'match');
    $('full').classList.toggle('hide', scene === 'match');
    const g = GAMES[st.game] || GAMES.valorant;
    document.documentElement.style.setProperty('--c', g.color);
    $('teamA').textContent = st.teamA; $('teamB').textContent = st.teamB;
    $('scoreA').textContent = st.scoreA; $('scoreB').textContent = st.scoreB;
    $('gameLogo').src = g.logo;
    $('bo').textContent = st.bo ? `BO${st.bo}` : '';
    $('phase').textContent = st.phase; $('phase').classList.toggle('hide', !st.phase);
    $('bugwrap').className = `bugwrap ${st.bugPos || 'top'}`;
    $('bugwrap').classList.toggle('hide', st.bugPos === 'hidden');
    if ($('msg').textContent !== st.message) $('msg').textContent = st.message;
    $('ticker').classList.toggle('static', st.message.length < 60);
    if (scene !== 'match') {
      const s = SCENES[scene] || SCENES.starting;
      $('fTitle').textContent = s.title;
      $('fSub').textContent = st.message || s.sub;
      $('fNext').classList.toggle('hide', !st.next.length);
      $('fNextList').replaceChildren(...st.next.map((t) => Object.assign(document.createElement('div'), {textContent: t})));
    }
  }

  function tick() {
    const el = $('fCount');
    const t = st && st.countdown ? new Date(st.countdown).getTime() - Date.now() : 0;
    if (t > 0) {
      const m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000);
      el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      el.classList.remove('hide');
    } else el.classList.add('hide');
  }

  async function poll() {
    try { st = await (await fetch('/api/stream', {cache: 'no-store'})).json(); apply(); } catch (e) {}
  }
  poll(); setInterval(poll, 1500); setInterval(tick, 250);
</script>
</body>
</html>
