<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — RAGE LAN 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logos/rushxp.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
<nav class="nav"><div class="container"><a class="logo" href="index.html" aria-label="RAGE LAN 2 — accueil"><img src="assets/da/logo-rage-lan-2.png" alt="LAN R.A.G.E 2"></a><span class="display" style="font-size:22px">Admin inscriptions</span>
  <span style="margin-left:auto;display:flex;gap:8px"><button class="btn small ghost hide" id="refresh">Actualiser</button><a class="btn small hide" id="tournoi" href="admin-tournoi.html">Tournois</a><a class="btn small ghost hide" id="emarg" href="emargement.html" target="_blank">Émargement</a><a class="btn small ghost hide" id="streamctl" href="stream/controle.html" target="_blank">Stream</a><button class="btn small ghost hide" id="backup">Sauvegarde</button><button class="btn small hide" id="export">Export CSV</button></span></div></nav>
<main class="container" style="max-width:1400px;padding-top:24px;padding-bottom:60px">
  <form id="login" class="panel" style="max-width:420px">
    <h2>Connexion</h2>
    <div class="field"><label for="pwd">Mot de passe admin</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <p><button class="btn" type="submit">Entrer</button></p>
    <div id="login-err"></div>
  </form>
  <div id="app" class="hide">
    <div class="stats" id="stats"></div>
    <div class="field" style="max-width:360px;margin-bottom:14px"><label for="filter">Filtrer</label>
      <select id="filter"><option value="paid">Payées</option><option value="partial">Paiement partiel (chacun sa part)</option><option value="pending">En attente de paiement</option><option value="all">Toutes</option></select></div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>Date</th><th>Statut</th><th>Compétition</th><th>Équipe</th><th>Joueurs</th><th>Montant</th><th>Actions</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script src="js/admin.js"></script>
</body>
</html>
