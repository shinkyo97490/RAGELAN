<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournois — Admin RAGE LAN 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logos/rushxp.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
<nav class="nav"><div class="container"><a class="logo rx" href="index.html" aria-label="Accueil"><img src="assets/da/logo-rushxp.png" alt="RushXP"></a><span class="display" style="font-size:22px">Admin tournois</span><span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><a class="btn small ghost" href="admin.html">Inscriptions</a><a class="btn small ghost" href="tournoi.html" target="_blank">Page publique</a><a class="btn small ghost" href="libres.html" target="_blank">Salles Joueurs libres</a><button class="btn small" id="refresh" type="button">Actualiser</button></span></div></nav>
<main class="container" style="max-width:1400px;padding-top:24px;padding-bottom:60px">
  <form id="login" class="panel hide" style="max-width:420px">
    <h2>Connexion</h2>
    <div class="field"><label for="pwd">Mot de passe admin</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <p><button class="btn" type="submit">Entrer</button></p>
    <div id="login-err"></div>
  </form>
  <div id="app" class="hide">
    <div class="tabs" id="tabs">
      <button type="button" data-tab="valorant" style="--c:var(--valorant)">Valorant</button>
      <button type="button" data-tab="rocketleague" style="--c:var(--rl)">Rocket League</button>
      <button type="button" data-tab="fc27" style="--c:var(--fc)">FC 27</button>
      <button type="button" data-tab="libres" style="--c:var(--orange)">Salles · TFT · Fortnite</button>
    </div>
    <div id="view"></div>
  </div>
</main>
<script src="js/t-common.js"></script>
<script src="js/admin-tournoi.js"></script>
</body>
</html>
