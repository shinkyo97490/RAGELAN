<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil · émargement — RAGE LAN 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logos/rushxp.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261117">
<style>
  .acc-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .acc-bar input[type=search] { flex: 1; min-width: 220px; padding: 14px 16px; font-size: 18px; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); }
  .acc-bar select { padding: 12px; font-size: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); }
  .acc-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .acc-stats div { background: var(--surface); padding: 10px 16px; font-family: var(--mono); font-size: 14px; letter-spacing: .06em; }
  .acc-stats b { font-size: 22px; color: var(--orange); margin-right: 6px; }
  .acc-group { margin: 22px 0 8px; font-size: 26px; font-weight: 900; text-transform: uppercase; border-left: 6px solid var(--c, var(--orange)); padding-left: 12px; }
  .acc-team { background: var(--surface); margin-bottom: 10px; }
  .acc-team h3 { margin: 0; padding: 12px 16px; font-size: 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line-2); }
  .acc-team h3 img { width: 34px; height: 34px; object-fit: contain; }
  .acc-team h3 small { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 700; }
  .pl { display: grid; grid-template-columns: minmax(170px, 1.3fr) repeat(3, minmax(150px, 1fr)); gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.06); }
  .pl:first-of-type { border-top: none; }
  .pl.ok { background: rgba(11, 246, 108, .07); }
  .pl .who b { font-size: 19px; display: block; }
  .pl .who span { font-size: 14px; color: var(--muted); }
  .pl .who .min { display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 2px 8px; background: #ff4655; color: #fff; }
  .pl .who .min.m16 { background: #f7941d; color: #0c0a09; }
  .chk { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px 12px; border: 2px solid var(--line-2); font-size: 15px; font-weight: 700; user-select: none; min-height: 52px; }
  .chk input { width: 26px; height: 26px; accent-color: #0bf66c; flex: none; }
  .chk.on { border-color: #0bf66c; background: rgba(11, 246, 108, .1); }
  .chk.todo { border-color: #ff4655; }
  .chk small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
  .na { font-size: 14px; color: var(--muted); padding: 10px 12px; }
  .pl > * { min-width: 0; }
  @media (max-width: 760px) { .pl { grid-template-columns: 1fr; } .acc-bar select { flex: 1; } .acc-stats div { flex: 1 1 140px; } .na { display: none; } }
</style>
</head>
<body class="admin">
<nav class="nav"><div class="container"><a class="logo rx" href="index.html"><img src="assets/da/logo-rushxp.png" alt="RushXP"></a><span class="display" style="font-size:22px">Accueil · émargement</span>
  <span style="margin-left:auto;display:flex;gap:8px"><button class="btn small" id="refresh" type="button">Actualiser</button></span></div></nav>
<main class="container" style="max-width:1200px;padding-top:20px;padding-bottom:60px">
  <form id="login" class="panel hide" style="max-width:420px">
    <h2>Connexion</h2>
    <div class="field"><label for="pwd">Mot de passe admin</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <p><button class="btn" type="submit">Entrer</button></p>
    <div id="login-err"></div>
  </form>
  <div id="app" class="hide">
    <div class="acc-bar">
      <input type="search" id="q" placeholder="Rechercher un pseudo, un nom ou une équipe…" autocomplete="off">
      <select id="comp"><option value="">Tous les tournois</option></select>
      <select id="show"><option value="all">Tout le monde</option><option value="todo">Pas encore arrivés</option><option value="minors">Mineurs seulement</option><option value="done">Arrivés</option></select>
    </div>
    <div class="acc-stats" id="stats"></div>
    <div id="list"></div>
  </div>
</main>
<script src="js/accueil.js?v=20261117"></script>
</body>
</html>
